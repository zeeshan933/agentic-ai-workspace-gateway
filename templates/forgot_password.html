{% extends "base.html" %}

{% block content %}
<div class="card glass-card w-100 mx-auto" style="max-width: 450px;">
    <div class="card-body p-5 text-center">
        <h3 class="fw-bolder text-white mb-2" style="letter-spacing: -0.5px;">Password Recovery</h3>
        <p class="text-glass-muted small mb-4">Enter your email address and we'll send you a 6-digit OTP to reset your password.</p>
        
        <form method="POST">
            <div class="mb-4">
                <input type="email" name="email" class="form-control glass-input text-center py-3 shadow-none" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="btn glass-btn btn-primary-gradient w-100 py-3 fw-bold">Send OTP</button>
        </form>
        
        <div class="mt-4 pt-2">
            <!-- Added a smooth hover effect using inline CSS transition -->
            <a href="{{ url_for('login') }}" class="text-decoration-none small" style="color: #cbd5e1; transition: color 0.2s;" onmouseover="this.style.color='#818cf8'" onmouseout="this.style.color='#cbd5e1'">&larr; Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
