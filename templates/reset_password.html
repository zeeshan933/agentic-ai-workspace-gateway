{% extends "base.html" %}

{% block content %}
<div class="card glass-card w-100 mx-auto" style="max-width: 450px;">
    <div class="card-body p-5">
        <h3 class="text-center fw-bolder text-white mb-4" style="letter-spacing: -0.5px;">Set New Password</h3>
        
        <form method="POST">
            <div class="mb-4">
                <label class="form-label text-glass-muted fw-semibold mb-2">New Password</label>
                <input type="password" name="password" class="form-control glass-input py-3 shadow-none" required autofocus>
            </div>
            <button type="submit" class="btn glass-btn btn-primary-gradient w-100 py-3 fw-bold">Confirm Reset</button>
        </form>
    </div>
</div>
{% endblock %}
