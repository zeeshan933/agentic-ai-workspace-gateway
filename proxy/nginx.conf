events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Global HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
    # 1. Flask Dashboard (UNPROTECTED - So users can log in)
    server {
        listen 443 ssl;
        # ---> CHANGED: Explicitly set to the dashboard subdomain
        server_name dashboard.example.com; 
        
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            # Bypasses Nginx caching if a Flask session exists
            # proxy_cache_bypass $cookie_session;
            # proxy_no_cache $cookie_session;

            proxy_pass http://flask-dashboard:5000;
            
            # Ensures Flask knows the original host
            proxy_set_header Host $host;
            
            # Passes the user's actual IP address to Flask
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CRITICAL: Tells Flask the original connection was HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

 # ====================================================
    # 2. FLOWISE (AI Agent Builder)
    # Subdomain: flowise.example.com
    # ====================================================
    server {
        listen 443 ssl;
        server_name ~^flowise\..*$;
        
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        
        # INCREASE MAXIMUM UPLOAD SIZE FOR FLOWISE IMPORTS
        client_max_body_size 50M;

        # ----------------------------------------------------
        # INTERNAL SSO AUTHENTICATION MECHANISM
        # ----------------------------------------------------
        location = /internal-auth {
            internal;
            proxy_pass http://flask-dashboard:5000/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
        }

        location @redirect_to_login {
            return 302 https://example.com/login; 
        }

        # ----------------------------------------------------
        # PROTECTED ROUTE: Force SSO only on the login page
        # ----------------------------------------------------
        location = /signin {
            auth_request /internal-auth;
            error_page 401 = @redirect_to_login;

            proxy_pass http://flowise:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------
        # UNPROTECTED: API & Streaming Optimization Rules
        # ----------------------------------------------------
        location ~ ^/(api/v1/prediction|api/v1/public-chatbots|api/v1/public-chatflows|api/v1/settings|api/v1/chatflows-streaming|api/v1/public-chatbotConfig|chatbot|assets) {
            proxy_pass http://flowise:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            # STREAMING/JSON RULES (Critical for LLM generation)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------
        # UNPROTECTED: Default Catch-All (Dashboards, etc.)
        # ----------------------------------------------------
        location / {
            proxy_pass http://flowise:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }


    # ====================================================
    # 3. n8n (Automation Workflow)
    # Subdomain: workflow.example.com
    # ====================================================
    server {
        listen 443 ssl;
        server_name workflow.example.com; 
        
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # ----------------------------------------------------
        # INTERNAL SSO AUTHENTICATION MECHANISM
        # ----------------------------------------------------
        location = /internal-auth {
            internal;
            proxy_pass http://flask-dashboard:5000/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
        }

        location @redirect_to_login {
            return 302 https://example.com/login; 
        }

        # ----------------------------------------------------
        # PROTECTED ROUTE: Force SSO only on the login page
        # ----------------------------------------------------
        location = /signin {
            auth_request /internal-auth;
            error_page 401 = @redirect_to_login;

            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------
        # UNPROTECTED: Default Catch-All (Webhooks, Dashboards)
        # ----------------------------------------------------
        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }

    # 4. Ollama (PROTECTED)
    server {
        listen 443 ssl;
        server_name ~^ollama\..*$;
        
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # SSO Authentication
        auth_request /internal-auth;
        error_page 401 = @redirect_to_login;

        location = /internal-auth {
            internal;
            proxy_pass http://flask-dashboard:5000/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
        }

        location @redirect_to_login {
            return 302 https://example.com/login; 
        }

        location / {
            proxy_pass http://ollama:11434;
            proxy_set_header Host $host;
        }
    }

} 
